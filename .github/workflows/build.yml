name: Build ZMK firmware
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read
  
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  matrix:
    name: Fetch Build Matrix
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      - id: set
        name: Read build.yaml
        run: |
          MATRIX_JSON=$(yq -o=json -I=0 '.builds' build.yaml)
          if [ -z "$MATRIX_JSON" ] || [ "$MATRIX_JSON" = "null" ]; then
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
          else
            echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build (${{ matrix.name }}, ${{ matrix.board }}, ${{ matrix.shield }})
    needs: matrix
    if: ${{ needs.matrix.outputs.matrix != '[]' }}
    runs-on: ubuntu-latest

    container:
      image: zmkfirmware/zmk-build-arm:stable
      credentials:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: West init / update
        run: |
          west init -l config
          west update
          west zephyr-export

      - name: Build firmware
        env:
          BOARD: ${{ matrix.board }}
          SHIELD: ${{ matrix.shield }}
          NAME: ${{ matrix.name }}
        run: |
          west build -p -s zmk/app -b "${BOARD}" -d "build/${NAME}" -- \
            -DSHIELD="${SHIELD}" \
            -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"

      - name: Collect artifacts
        run: |
          mkdir -p out
          cp build/${{ matrix.name }}/zephyr/*.uf2 out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.name }}
          path: out/
